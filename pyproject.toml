[project]
name = "fstracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Toni Patama", email = "tonipat047@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "cryptography>=50.0.2",
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.2.4",
    "whitenoise>=6.12.0",
]

[project.scripts]
fstracker = "fstracker:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
