# nginx site for fs.tnptm.top. Install as /etc/nginx/conf.d/fs.tnptm.top.conf
# (conf.d files are included inside the http {} block, so the zones below are valid here).
#
# Upstreams are the compose containers, published on 127.0.0.1 only:
#   3000 -> Next.js (the app and the /api proxy to Django)
#   8000 -> Django/gunicorn (only for /admin/ and /static/, which Next doesn't serve)

# Brute-force protection for credential endpoints: 10 requests/minute per client IP.
limit_req_zone $binary_remote_addr zone=fs_auth:10m rate=10r/m;
limit_req_status 429;

upstream fs_frontend {
    server 127.0.0.1:3000;
    keepalive 8;
}

upstream fs_backend {
    server 127.0.0.1:8000;
    keepalive 4;
}

server {
    listen 80;
    listen [::]:80;
    server_name fs.tnptm.top;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fs.tnptm.top;

    ssl_certificate     /etc/letsencrypt/live/fs.tnptm.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fs.tnptm.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:fs_ssl:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # The API only takes small JSON bodies.
    client_max_body_size 1m;
    client_body_timeout 15s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Shared proxy settings (inherited by every location below that doesn't set its own).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite, never append: Django (DJANGO_NUM_PROXIES=1) trusts exactly this value
    # as the client IP for rate limiting, so a client-supplied header must not survive.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Login / sign-up / token refresh: rate limited here before reaching the app.
    location ~ ^/api/auth/(login|register|refresh)/?$ {
        limit_req zone=fs_auth burst=10 nodelay;
        proxy_pass http://fs_frontend;
    }

    # Django admin and its static files go straight to gunicorn.
    location /admin/ {
        # allow 203.0.113.10;   # uncomment and set your IP to restrict the admin
        # deny  all;
        limit_req zone=fs_auth burst=20 nodelay;
        proxy_pass http://fs_backend;
    }

    location /static/ {
        proxy_pass http://fs_backend;
    }

    # Everything else: the Next.js app (which proxies /api/* to Django).
    location / {
        proxy_pass http://fs_frontend;
    }
}
